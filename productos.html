<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PymeControl Web - Productos</title>
    <style>
        body { font-family: Segoe UI, sans-serif; margin: 0; display: flex; background: #f4f6f4; color: #2c352c; }
        .main-content { margin-left: 280px; padding: 40px; width: calc(100% - 280px); box-sizing: border-box; }
        h1 { color: #232b23; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.04); margin-bottom: 25px; border-top: 4px solid #556b2f; }
        label { display: block; margin-top: 12px; font-weight: 600; color: #3a473a; font-size: 14px; }
        input, select, button { display: block; margin-top: 5px; padding: 10px; width: 100%; max-width: 350px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { background: #556b2f; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; transition: background 0.3s; }
        button:hover { background: #3f4e3f; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        th { background: #e8ede8; color: #232b23; font-weight: 600; }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>📦 Módulo de Inventario y Productos</h1>

        <div class="card">
            <h2>Registrar / Adquirir Producto</h2>
            <form id="form-producto">
                <label>ID del Producto:</label>
                <input type="text" id="prod-id" required placeholder="Ej: P001">

                <label>Nombre del Producto:</label>
                <input type="text" id="prod-nombre" required placeholder="Ej: Monitor LED 24&quot;">

                <label>Precio Unitario ($):</label>
                <input type="number" id="prod-precio" required min="0" step="0.01" placeholder="0.00">

                <label>Stock Inicial:</label>
                <input type="number" id="prod-stock" required min="0" placeholder="0">

                <label>Origen Financiero del Ingreso:</label>
                <select id="prod-origen" required>
                    <option value="compra">Compra de Productos (Descuenta del Presupuesto)</option>
                    <option value="capital">Aporte de Capital / Inventario Externo (Sin descuento)</option>
                </select>

                <button type="submit">Procesar Registro</button>
            </form>
        </div>

        <div class="card">
            <h2>Inventario Actualizado</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio Unitario</th>
                        <th>Stock Disponible</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { cargarSidebar } from './src/sidebar.js';
        import { StorageManager } from './src/Storage.js';
        import { Producto } from './src/Producto.js';

        cargarSidebar('productos');

        const formProducto = document.getElementById('form-producto');
        const tablaProductos = document.getElementById('tabla-productos');
        
        let empresa = StorageManager.obtenerEmpresa();
        let productos = StorageManager.obtenerProductos();

        function renderizarProductos() {
            tablaProductos.innerHTML = '';
            productos.forEach(prod => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${prod.getId()}</td>
                    <td>${prod.getNombre()}</td>
                    <td>$${prod.getPrecio().toFixed(2)}</td>
                    <td>${prod.getStock()} unidades</td>
                `;
                tablaProductos.appendChild(fila);
            });
        }

        renderizarProductos();

        formProducto.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const nombre = document.getElementById('prod-nombre').value;
            const precio = Number(document.getElementById('prod-precio').value);
            const stock = Number(document.getElementById('prod-stock').value);
            const origen = document.getElementById('prod-origen').value;

            const costoTotal = precio * stock;

            // Lógica financiera de origen
            if (origen === 'compra') {
                if (empresa.getPresupuesto() >= costoTotal) {
                    empresa.actualizarPresupuesto(-costoTotal); // Resta del presupuesto
                } else {
                    alert(`Presupuesto insuficiente. La compra requiere $${costoTotal.toFixed(2)} y el presupuesto actual es $${empresa.getPresupuesto().toFixed(2)}.`);
                    return;
                }
            }

            const nuevoProducto = new Producto(id, nombre, precio, stock);
            productos.push(nuevoProducto);

            // Guardar cambios en Storage
            StorageManager.guardarEmpresa(empresa);
            StorageManager.guardarProductos(productos);

            renderizarProductos();
            formProducto.reset();
            alert(origen === 'compra' 
                ? `Compra procesada con éxito. Se descontaron $${costoTotal.toFixed(2)} del presupuesto de la empresa.` 
                : "Producto registrado como capital/inventario externo sin afectar presupuesto.");
        });
    </script>
</body>
</html>
