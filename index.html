<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PymeControl Web - Dashboard</title>
    <style>
        body { font-family: Segoe UI, Tahoma, sans-serif; margin: 0; display: flex; background: #f4f6f4; color: #2c352c; }
        .main-content { margin-left: 280px; padding: 40px; width: calc(100% - 280px); box-sizing: border-box; }
        h1 { color: #232b23; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
        .card-metric { 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.04); 
            border-top: 4px solid #d4af37; /* Acento dorado */
        }
        .card-metric h3 { margin: 0; color: #556b2f; font-size: 13px; letter-spacing: 0.5px; }
        .card-metric p { margin: 12px 0 0; font-size: 28px; font-weight: bold; color: #232b23; }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>📊 Panel Principal de Gerencia</h1>
        <p>Indicadores clave y control financiero en tiempo real de PymeControl Web.</p>

        <!-- Tarjetas Indicadores -->
        <div class="metrics-grid">
            <div class="card-metric">
                <h3>PRESUPUESTO EMPRESA</h3>
                <p id="dash-presupuesto">$0.00</p>
            </div>
            <div class="card-metric">
                <h3>TOTAL EMPLEADOS</h3>
                <p id="dash-empleados">0</p>
            </div>
            <div class="card-metric">
                <h3>PRODUCTOS EN STOCK</h3>
                <p id="dash-productos">0</p>
            </div>
            <div class="card-metric">
                <h3>VENTAS REALIZADAS</h3>
                <p id="dash-ventas">0</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { cargarSidebar } from './src/sidebar.js';
        import { StorageManager } from './src/Storage.js';

        cargarSidebar('inicio');

        const empresa = StorageManager.obtenerEmpresa();
        const empleados = StorageManager.obtenerEmpleados();
        const productos = StorageManager.obtenerProductos();
        const ventas = StorageManager.obtenerVentas();

        document.getElementById('dash-presupuesto').textContent = `$${empresa.getPresupuesto().toFixed(2)}`;
        document.getElementById('dash-empleados').textContent = empleados.length;
        document.getElementById('dash-productos').textContent = productos.reduce((acc, p) => acc + p.getStock(), 0);
        document.getElementById('dash-ventas').textContent = ventas.length;
    </script>
</body>
</html>
