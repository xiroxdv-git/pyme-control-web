<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PymeControl Web - Dashboard</title>
    <style>
        body { font-family: Segoe UI, sans-serif; margin: 0; display: flex; background: #f1f5f9; }
        .sidebar { width: 240px; height: 100vh; background: #0f172a; color: white; padding: 20px; position: fixed; }
        .sidebar a { display: block; color: #94a3b8; text-decoration: none; padding: 12px; margin: 5px 0; border-radius: 6px; }
        .sidebar a.active, .sidebar a:hover { background: #2563eb; color: white; }
        .main-content { margin-left: 280px; padding: 30px; width: 100%; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card-metric { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card-metric h3 { margin: 0; color: #64748b; font-size: 14px; }
        .card-metric p { margin: 10px 0 0; font-size: 24px; font-weight: bold; color: #1e293b; }
        .quick-actions { display: flex; gap: 20px; }
        .btn-action { background: #2563eb; color: white; text-decoration: none; padding: 15px 25px; border-radius: 8px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>📊 Panel Principal de Gerencia</h1>
        <p>Bienvenido al sistema gerencial PymeControl Web.</p>

        <!-- Tarjetas Indicadores -->
        <div class="metrics-grid">
            <div class="card-metric">
                <h3>PRESUPUESTO EMPRESA</h3>
                <p id="dash-presupuesto">$0.00</p>
            </div>
            <div class="card-metric">
                <h3>TOTAL EMPLEADOS</h3>
                <p id="dash-empleados">0</p>
            </div>
            <div class="card-metric">
                <h3>PRODUCTOS EN STOCK</h3>
                <p id="dash-productos">0</p>
            </div>
            <div class="card-metric">
                <h3>VENTAS REALIZADAS</h3>
                <p id="dash-ventas">0</p>
            </div>
        </div>

        <h2>🚀 Acceso Rápido a Módulos</h2>
        <div class="quick-actions">
            <a href="empleados.html" class="btn-action">👥 Gestionar Personal</a>
            <a href="productos.html" class="btn-action">📦 Gestionar Inventario</a>
            <a href="ventas.html" class="btn-action" style="background:#16a34a;">🛒 Registrar Venta</a>
        </div>
    </div>

    <script type="module">
        import { cargarSidebar } from './src/sidebar.js';
        import { StorageManager } from './src/Storage.js';

        cargarSidebar('inicio');

        const empresa = StorageManager.obtenerEmpresa();
        const empleados = StorageManager.obtenerEmpleados();
        const productos = StorageManager.obtenerProductos();
        const ventas = StorageManager.obtenerVentas();

        document.getElementById('dash-presupuesto').textContent = `$${empresa.getPresupuesto().toFixed(2)}`;
        document.getElementById('dash-empleados').textContent = empleados.length;
        document.getElementById('dash-productos').textContent = productos.reduce((acc, p) => acc + p.getStock(), 0);
        document.getElementById('dash-ventas').textContent = ventas.length;
    </script>
</body>
</html>
